theme = "terminal-mono"

[editor]
line-number = "absolute"
true-color = true
scrolloff = 1
idle-timeout = 0
soft-wrap = { enable = true }
mouse = true
completion-timeout = 5
completion-trigger-len = 1
jump-label-alphabet = "ntdhseriaobkjlguvmfycxzwqp"
trim-trailing-whitespace = true
clipboard-provider = "pasteboard"
auto-pairs = false
auto-completion = false
cursorline = false

[editor.lsp]
enable = false

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.inline-diagnostics]
cursor-line = "hint"
other-lines = "hint"

[editor.statusline]
right = ["version-control", "diagnostics", "selections", "position", "file-encoding"]
render = "single"

[editor.gutters]
layout = ["line-numbers", "spacer", "diff"]

[editor.word-completion]
trigger-length = 1

[keys.normal]
# Sent by tmux-open-in-helix when a file location is double-clicked in another
# pane. Reading the path out of a file beats typing ":open <path>", which makes
# Helix recompute a directory completion for every character of the path.
F12 = ":open %sh{cat $HOME/.cache/helix/open-$TMUX_PANE}"
esc = ["collapse_selection", "keep_primary_selection"]
";" = "command_mode"
"C-e" = "@:e "
"C-b" = "@:b "
"C-r" = "@:e <C-r>%<C-w>"
"C-h" = "jump_view_left"
"C-l" = "jump_view_right"
"C-j" = "jump_view_down"
"C-k" = "jump_view_up"
W = 'move_next_sub_word_start'
B = 'move_prev_sub_word_start'
E = 'move_next_sub_word_end'
C-g = [
  ":new",
  ":insert-output lazygit",
  ":set mouse false",
  ":set mouse true",
  ":buffer-close!",
  ":redraw"
]
"{" = "goto_prev_paragraph"
"}" = "goto_next_paragraph"

[keys.select]
F12 = ":open %sh{cat $HOME/.cache/helix/open-$TMUX_PANE}"
W = 'extend_next_sub_word_start'
B = 'extend_prev_sub_word_start'
E = 'extend_next_sub_word_end'
"{" = "goto_prev_paragraph"
"}" = "goto_next_paragraph"

# Bound in every mode a click can land in, so the script never has to guess
# which mode Helix was left in.
[keys.insert]
F12 = ":open %sh{cat $HOME/.cache/helix/open-$TMUX_PANE}"

[keys.normal."space"]
c = "file_picker_in_current_buffer_directory"
